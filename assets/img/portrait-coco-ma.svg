<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" width="520" height="720" role="img" aria-label="An editorial portrait: a figure in dark tailoring turned away from camera, rim lit against a black studio background">
  <defs>
    <radialGradient id="ptbg" cx="0.6" cy="0.22" r="0.86">
      <stop offset="0%" stop-color="#5B6472"/>
      <stop offset="26%" stop-color="#333A45"/>
      <stop offset="58%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#030405"/>
    </radialGradient>
    <linearGradient id="pthair" x1="0.08" y1="0.1" x2="0.95" y2="0.9">
      <stop offset="0%" stop-color="#030304"/>
      <stop offset="52%" stop-color="#070709"/>
      <stop offset="82%" stop-color="#101015"/>
      <stop offset="100%" stop-color="#1E1C23"/>
    </linearGradient>
    <linearGradient id="ptcoat" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0%" stop-color="#040405"/>
      <stop offset="72%" stop-color="#08080B"/>
      <stop offset="100%" stop-color="#14141A"/>
    </linearGradient>
    <linearGradient id="ptrim" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F4EEE2" stop-opacity="0.15"/>
      <stop offset="22%" stop-color="#F7F2E7" stop-opacity="0.80"/>
      <stop offset="56%" stop-color="#CFC4AE" stop-opacity="0.46"/>
      <stop offset="100%" stop-color="#CFC4AE" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ptstrand" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#B9AE9A" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#8A8175" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8A8175" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ptfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030405" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#030405" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030405" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="ptside" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#030405" stop-opacity="0.72"/>
      <stop offset="38%" stop-color="#030405" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030405" stop-opacity="0.35"/>
    </linearGradient>
    
  <filter id="ptb" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="20"/>
  </filter>
    
  <filter id="ptg" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="1.05" numOctaves="3" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feComponentTransfer in="g">
      <feFuncA type="linear" slope="0.075"/>
    </feComponentTransfer>
  </filter>
  </defs>

  <rect width="520" height="720" fill="url(#ptbg)"/>
  <ellipse cx="300" cy="150" rx="230" ry="210" fill="#6E7887" opacity="0.42" filter="url(#ptb)"/>

  <path d="M 168,470 C 116,498 74,548 58,606 C 44,654 38,692 36,720 L 496,720 C 492,690 484,650 468,606 C 448,550 404,500 352,472 C 330,516 316,566 308,624 C 296,566 282,516 260,478 Z" fill="url(#ptcoat)"/>
  <path d="M 352,472 C 404,500 448,550 468,606 C 482,648 490,686 494,716" fill="none" stroke="url(#ptrim)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 258,44 C 348,44 396,116 392,206 C 388,268 376,330 372,392 C 370,452 384,520 396,596 C 404,650 406,690 402,720 L 132,720 C 126,684 132,634 144,580 C 158,514 168,452 166,394 C 162,330 150,268 146,206 C 142,116 168,44 258,44 Z" fill="url(#pthair)"/>
  <path d="M 336,110 C 366,180 372,266 362,344 C 354,414 366,506 380,596" fill="none" stroke="url(#ptstrand)" stroke-width="2.2" opacity="0.5"/><path d="M 300,80 C 330,168 338,262 330,340 C 322,412 332,500 344,590" fill="none" stroke="url(#ptstrand)" stroke-width="1.6" opacity="0.34"/><path d="M 200,96 C 178,180 176,268 186,346 C 194,416 184,506 172,594" fill="none" stroke="url(#ptstrand)" stroke-width="1.3" opacity="0.22"/>
  <path d="M 262,44 C 350,46 396,116 392,206 C 388,268 376,330 372,392 C 370,452 384,520 396,596 C 404,646 406,686 403,716" fill="none" stroke="url(#ptrim)" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M 262,44 C 350,46 396,116 392,206 C 388,268 376,330 372,392 C 370,452 384,520 396,596 C 404,646 406,686 403,716" fill="none" stroke="url(#ptrim)" stroke-width="15" opacity="0.42" stroke-linecap="round" filter="url(#ptb)"/>

  <rect width="520" height="720" fill="url(#ptside)"/>
  <rect width="520" height="720" fill="url(#ptfade)"/>
  <rect width="520" height="720" filter="url(#ptg)" opacity="0.7" style="mix-blend-mode:overlay"/>
</svg>
